spring:
  application:
    name: app-trade-marketing
  profiles:
    active: dev
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Caracas
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB

server:
  port: 8081
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
    max-connections: 8192
    connection-timeout: 20000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript

# APIs externas del ERP. Esta app NO abre una conexión de base de datos al
# ERP, solo llama a sus endpoints REST ya existentes.
# - clientes-api (vettal-backend): autenticación HTTP Basic.
# - productos-api (API propia del ERP, tabla lista_prod_pw): autenticación
#   con apikey por query param.
# Los valores reales (URLs, credenciales) quedan hardcodeados por entorno
# en application-dev.yml / application-prod.yml, no acá.

jwt:
  expiration-ms: 86400000

cors:
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With

logging:
  level:
    ve.com.vettal.trademarketing: INFO
    org.hibernate.SQL: WARN
    org.apache.tomcat: INFO
  file:
    name: logs/app-trade-marketing.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
